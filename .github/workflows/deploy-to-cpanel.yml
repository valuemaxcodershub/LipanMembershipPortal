# Auto-deploy to cPanel is DISABLED.
# Deployment is now: build locally → upload files to cPanel by FTP/File Manager.
# GitHub is used only as source backup (git push).
#
# This workflow is kept inactive so an accidental push to master
# cannot overwrite members.lipanonline.org.

on:
  push:
    branches: ["master"]

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4

      # ✅ Step 1: Setup pnpm first (installs it properly)
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # or match your project's version
          run_install: false

      # ✅ Step 2: Setup Node.js and enable pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Create .env.production
        run: |
          echo "${{ secrets.APP_ENV }}" >> .env.production

      # ✅ Step 3: Install and build using pnpm
      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ✅ Step 4: Deploy to cPanel
      - name: Deploy React build to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: dist/